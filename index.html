

<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f23">
<link rel="manifest" href="./manifest.json">
<title>አቡኪ ሎተሪ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f2;color:#183321}
header{background:#087f23;color:white;text-align:center;padding:22px 12px}
header h1{margin:0 0 8px}
main{max-width:650px;margin:auto;padding:15px}
.card{background:white;padding:17px;margin:14px 0;border-radius:15px;box-shadow:0 3px 12px #0001}
input,button{width:100%;padding:13px;margin-top:10px;border-radius:9px;font-size:16px}
input{border:1px solid #bbb}
button{border:0;background:#087f23;color:white;font-weight:bold}
button:disabled{background:#aaa}
.stats{display:flex;justify-content:space-between;gap:8px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}
.ticket{padding:12px 0;border:1px solid #087f23;background:#fff;color:#087f23;border-radius:8px}
.ticket.selected{background:#087f23;color:white}
.ticket.taken{background:#ddd;color:#777;border-color:#ddd}
.small{font-size:13px;color:#555}
.result{font-size:22px;text-align:center;font-weight:bold;color:#087f23;overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <h1>🎟️ አቡኪ ሎተሪ</h1>
  <div>የሙከራ ስሪት · እውነተኛ ክፍያ የለውም</div>
</header>
<main>
  <section class="card">
    <h2>የቲኬት ምርጫ</h2>
    <div class="stats">
      <span>ዋጋ፦ 100 ብር</span>
      <span id="count">የተመረጡ፦ 0</span>
    </div>
    <p class="small">ቲኬት ለመምረጥ ቁጥሩን ጫን።</p>
    <div class="grid" id="tickets"></div>
  </section>

  <section class="card">
    <h2>የተጠቃሚ መረጃ</h2>
    <input id="player" maxlength="60" placeholder="ስምህን አስገባ">
    <p id="total">ጠቅላላ፦ 0 ብር</p>
    <button id="register">ለሙከራ ቲኬት መመዝገብ</button>
    <p class="small">ይህ ምዝገባ በዚህ መሣሪያ ላይ ብቻ ይቀመጣል፤ ክፍያ አይፈጽምም።</p>
    <div id="message" role="status"></div>
  </section>

  <section class="card">
    <h2>የዕጣ አወጣጥ</h2>
    <p class="small">በሙከራ የተመዘገቡ ቲኬቶች መካከል አንድ ዕጣ ይመረጣል።</p>
    <button id="draw">🎲 ዕጣ አውጣ</button>
    <div id="result" class="result" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>የሙከራ ምዝገባዎች</h2>
    <div id="history">ምዝገባ የለም።</div>
    <button id="reset" style="background:#9b2525">የሙከራ መረጃዎችን አጥፋ</button>
  </section>
</main>

<script>
const SUPABASE_URL = "https://bofjfmjbgbppxkhiubey.supabase.co";
const SUPABASE_KEY = "sb_publishable_utApJBhyvU2mmPGYkpdJBg_niJW2tTx";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
let remoteTicketStatuses = new Map();
let remoteHistory = [];
async function testSupabaseConnection() {
  const { data, error } = await supabaseClient.rpc(
    "get_registered_lottery_tickets"
  );

  if (error) {
    console.error("Supabase error:", error.message);
    $("message").textContent =
      "የSupabase ግንኙነት አልተሳካም።";
    return;
  }

  remoteTicketStatuses = new Map(
    data.map(ticket => [
      pad(ticket.ticket_number),
      String(ticket.status).toLowerCase()
    ])
  );

  update();

  $("message").textContent =
    "ተሳክቷል! የቲኬት ሁኔታ ከSupabase ተገኝቷል።";
}


const KEY = "abukiLotteryDemoV1";
let selected = [];
let records = [];
let drawn = false;
const WINNER_KEY = "abukiLotteryWinnerV1";
let savedWinner = localStorage.getItem(WINNER_KEY) || "";
try {
  records = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (!Array.isArray(records)) records = [];
} catch {
  records = [];
}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(3, "0");
const booked = () => new Set(records.flatMap(r => r.tickets));

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(records));
    return true;
  } catch {
    $("message").textContent = "መረጃውን ማስቀመጥ አልተቻለም።";
    return false;
  }
}

function renderTickets() {
  const grid = $("tickets");
  grid.innerHTML = "";
  const used = booked();

for (const [id, status] of remoteTicketStatuses) {
  if (status !== "available") {
    used.add(id);
  }
}

  for (let n = 1; n <= 100; n++) {
    const id = pad(n);
    const b = document.createElement("button");
    b.textContent = id;
    b.className = "ticket";
    b.type = "button";

    if (used.has(id)) {
      b.classList.add("taken");
      b.disabled = true;
      b.title = "ተመዝግቧል";
    } else if (selected.includes(id)) {
      b.classList.add("selected");
    }

    b.addEventListener("click", () => {
      if (used.has(id) || drawn) return;
      if (selected.includes(id)) {
        selected = selected.filter(x => x !== id);
      } else {
        selected.push(id);
      }
      update();
    });
    grid.appendChild(b);
  }
}

function update() {
  $("count").textContent = "የተመረጡ፦ " + selected.length;
  $("total").textContent =
    "ጠቅላላ፦ " + (selected.length * 100) + " ብር";
  renderTickets();
  renderHistory();
}

async function renderHistory() {
  const box = $("history");
  box.textContent = "የምዝገባ ታሪክ በመጫን ላይ...";

  const { data, error } = await supabaseClient.rpc(
    "get_lottery_history"
  );

  if (error) {
   remoteHistory = data || []; 
  console.error("History error:", error.message);
    box.textContent =
      "የታሪክ መረጃን ማግኘት አልተቻለም።";
    return;
  }

  box.innerHTML = "";

  if (!data || data.length === 0) {
    box.textContent = "ምዝገባ የለም።";
    return;
  }

  data.forEach(item => {
    const p = document.createElement("p");
    p.textContent =
      item.player_name +
      " — ቲኬት: " +
      pad(item.ticket_number) +
      " — የሙከራ ምዝገባ";
    box.appendChild(p);
  });
}

$("register").addEventListener("click", async () => {
  const button = $("register");

  if (drawn) {
    $("message").textContent =
      "ዕጣው ወጥቷል።";
    return;
  }

  const name = $("player").value.trim();

  if (!name) {
    $("message").textContent =
      "እባክህ ስምህን አስገባ።";
    return;
  }

  if (!selected.length) {
    $("message").textContent =
      "ቢያንስ አንድ ቲኬት ምረጥ።";
    return;
  }

  if (selected.some(id =>
    remoteTicketStatuses.get(id) !== "available"
  )) {
    $("message").textContent =
      "አንዳንድ ቲኬቶች ተይዘዋል። እንደገና ምረጥ።";
    selected = [];
    await testSupabaseConnection();
    update();
    return;
  }

  button.disabled = true;
  $("message").textContent =
    "ምዝገባው በመካሄድ ላይ ነው...";

  try {
    const { error } = await supabaseClient.rpc(
      "register_lottery_tickets",
      {
        p_name: name,
        p_tickets: selected.map(Number)
      }
    );

    if (error) {
      console.error("Registration error:", error.message);
      $("message").textContent =
        "ምዝገባው አልተሳካም። ቲኬቶቹ ተይዘው ሊሆኑ ይችላሉ።";
      await testSupabaseConnection();
      return;
    }

    selected = [];
    $("player").value = "";

    await testSupabaseConnection();

    $("message").textContent =
      "የሙከራ ምዝገባው በSupabase ተቀምጧል።";

  } catch (err) {
    console.error(err);
    $("message").textContent =
      "የግንኙነት ችግር አለ። እባክህ እንደገና ሞክር።";
  } finally {
    button.disabled = false;
  }
});


$("draw").addEventListener("click", () => {
  if (drawn) {
    $("result").textContent = "ዕጣው ቀድሞ ወጥቷል።";
    return;
  }
  const pool = remoteHistory.map(item => ({
  ticket: pad(item.ticket_number),
  name: item.player_name
}));

  if (!pool.length) {
    $("result").textContent = "መጀመሪያ የሙከራ ቲኬት መዝግብ።";
    return;
  }

  const winner = pool[Math.floor(Math.random() * pool.length)];
  drawn = true;
  localStorage.setItem(
  WINNER_KEY,
  JSON.stringify(winner)
);
  $("result").textContent =
    "የሙከራ ዕጣ፦ " + winner.ticket +
    " · ስም፦ " + winner.name;
  $("draw").disabled = true;
});

$("reset").addEventListener("click", () => {
  if (!confirm("ሁሉንም የሙከራ ምዝገባዎች እና ውጤት ማጥፋት ትፈልጋለህ?")) return;
  records = [];
  selected = [];
  drawn = false;
  try { localStorage.removeItem(KEY); } catch {}
 try { localStorage.removeItem(WINNER_KEY); } catch {}
  $("result").textContent = "";
  $("message").textContent = "የሙከራ መረጃዎች ተጠርገዋል።";
  $("draw").disabled = false;
  update();
});
try {
  if (savedWinner) {
    const winner = JSON.parse(savedWinner);
    drawn = true;
    $("result").textContent =
      "የዕድለኛ ቁጥር፦ " + winner.ticket +
      " | ስም፦ " + winner.name;
    $("draw").disabled = true;
  }
} catch (e) {
  localStorage.removeItem(WINNER_KEY);
}
update();
testSupabaseConnection()
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => {
        console.log("Abuki App is ready");
      })
      .catch((error) => {
        console.error("Service Worker error:", error);
      });
  });
}
</script>
</body>
</html>
